<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TODOリスト</h1>

        <div class="progress-section">
            <div class="progress-header">
                <h2>完成度</h2>
                <span class="progress-percentage" id="progressPercentage">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-stats">
                <div class="stat-item">
                    <span class="stat-label">完了</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未完了</span>
                    <span class="stat-value" id="activeCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">合計</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="新しいタスクを入力...">
            <button id="addBtn">追加</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="active">未完了</button>
            <button class="filter-btn" data-filter="completed">完了済み</button>
        </div>

        <ul id="taskList"></ul>

        <div class="stats">
            <span id="taskCount">0</span> 件のタスク
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
